<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>
</head>
<body>
<title>台灣好味島</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="22 縣市名產與景點的 3D 台灣島：點一格縣市，看它的名產、景點和可以聊的話題，還有名產猜縣市小遊戲。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: full-bleed 3D sea with one Taiwan-shaped hex island (+ offshore isles); brand chip top-left, index panel right (bottom sheet on phones), county card left. */
:root{
  --ink:#1c2b2f; --ink-2:#4b5d61; --paper:#f4f7f5; --panel:rgba(250,252,250,.94); --line:#d5dfdb; --mist:#dfeef0;
  --north:#3f6fd0; --mid:#2f9a5a; --south:#d9822b; --east:#1f9e94; --isle:#9b59c4;
  --gold:#c9902a; --ok:#2f9a5a; --bad:#d0493f;
  --f-display:"LXGW WenKai TC","Noto Sans TC","PingFang TC",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --shadow:0 10px 30px rgba(28,43,47,.14);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ink:#e6eeec; --ink-2:#a9bbb7; --paper:#121b1e; --panel:rgba(22,32,35,.94); --line:#2c3c40; --mist:#16232a;
  --north:#7d9ef0; --mid:#5cc483; --south:#f0a85a; --east:#4fd0c4; --isle:#c590e6; --gold:#e3b257; --ok:#5cc483; --bad:#f07a70; color-scheme:dark;
  --shadow:0 10px 30px rgba(0,0,0,.4);}}
:root[data-theme="dark"]{
  --ink:#e6eeec; --ink-2:#a9bbb7; --paper:#121b1e; --panel:rgba(22,32,35,.94); --line:#2c3c40; --mist:#16232a;
  --north:#7d9ef0; --mid:#5cc483; --south:#f0a85a; --east:#4fd0c4; --isle:#c590e6; --gold:#e3b257; --ok:#5cc483; --bad:#f07a70; color-scheme:dark;
  --shadow:0 10px 30px rgba(0,0,0,.4);}
html,body{height:100%;margin:0}
[hidden]{display:none!important}
body{background:var(--mist);color:var(--ink);font-family:var(--f-body);overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#app{position:fixed;inset:0}
#stage{position:absolute;inset:0}
#stage canvas{display:block;touch-action:none}
#stage canvas{cursor:grab} #stage canvas.grabbing{cursor:grabbing}
.drag-hint{position:absolute;left:50%;top:calc(50% + 40px);transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:999px;font-size:14px;box-shadow:var(--shadow);pointer-events:none;z-index:5;white-space:nowrap;transition:opacity .5s}
.drag-hint.bye{opacity:0}
@media (min-width:861px){.drag-hint{left:calc(50% - 180px)}}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:0}  /* own stacking context: label z-order never rises above the panels */
.r-北部{--rc:var(--north)} .r-中部{--rc:var(--mid)} .r-南部{--rc:var(--south)} .r-東部{--rc:var(--east)} .r-離島{--rc:var(--isle)}
.tag{position:absolute;left:0;top:0;white-space:nowrap;pointer-events:auto;
  display:flex;align-items:center;gap:5px;padding:3px 10px 3px 4px;border-radius:999px;border:0;
  background:var(--panel);box-shadow:0 2px 8px rgba(0,0,0,.15);font-size:13px;font-weight:700;transition:opacity .2s}
.tag i{font-style:normal;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--rc);font-size:13px}
.compact .tag:not(.on){font-size:11px;padding:2px 7px 2px 2px} .compact .tag:not(.on) i{width:17px;height:17px;font-size:10px}
.tag.dim{opacity:.3} .tag.on{outline:2px solid var(--gold)}
.nolabels .tag:not(.on){display:none!important}

.brand{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));
  background:var(--panel);border-radius:18px;padding:12px 16px;box-shadow:var(--shadow);max-width:min(340px,calc(100vw - 32px))}
.brand .eyebrow{font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;color:var(--ink-2)}
.brand h1{font-family:var(--f-display);font-size:30px;margin:2px 0 4px;line-height:1.1}
.brand h1 span{color:var(--gold)}
.rep-btn{position:absolute;top:8px;right:10px;border:1px solid var(--line);background:transparent;color:var(--ink-2);font:600 11px/1 var(--f-body,inherit);padding:5px 8px;border-radius:999px;cursor:pointer;opacity:.75}
.rep-btn:hover,.rep-btn:focus-visible{opacity:1;color:var(--ink)}
.brand p{margin:0;font-size:12.5px;color:var(--ink-2);line-height:1.55}
.regions{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap}
.regions button{border:0;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700;color:#fff;background:var(--rc)}
.regions .all{background:var(--ink);color:var(--paper)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:10px;background:var(--mist);padding:4px;border-radius:12px}
.modes button{border:0;background:transparent;border-radius:9px;padding:7px 6px;font-size:13.5px;font-weight:700;color:var(--ink-2)}
.modes button[aria-pressed="true"]{background:var(--gold);color:#fff;box-shadow:0 1px 4px rgba(0,0,0,.15)}
body[data-mode="mission"] .regions,body[data-mode="mission"] .foot{display:none}
/* mission mode */
.m-lead{font-size:14.5px;line-height:1.7;color:var(--ink-2);margin:0 0 12px} .m-lead b{color:var(--ink)}
.m-h{font-family:var(--f-display);font-size:17px;margin:14px 0 6px}
.m-roles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.m-role{display:grid;grid-template-columns:34px 1fr;grid-template-rows:auto auto auto;column-gap:6px;text-align:left;border:2px solid var(--line);background:var(--paper);border-radius:14px;padding:10px}
.m-role .e{grid-row:1/4;font-size:26px;line-height:1.2} .m-role b{font-size:16px} .m-role small{font-size:12px;color:var(--ink-2);line-height:1.45;min-width:0} .m-role em{font-style:normal;font-size:11px;color:var(--gold);margin-top:3px}
.m-role.on{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 12%,var(--paper))}
.m-looks{display:flex;flex-wrap:wrap;gap:6px} .m-looks button{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 14px;font-size:14px}
.m-looks button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.m-pass{display:grid;grid-template-columns:repeat(10,minmax(0,38px));gap:5px;margin-bottom:12px}
.m-pass i{font-style:normal;aspect-ratio:1;border-radius:50%;border:1.5px dashed var(--line);display:grid;place-items:center;font-size:11px;color:var(--ink-2);font-family:var(--f-display)}
.m-pass i.on{border:0;background:var(--rc);color:#fff;font-weight:700;transform:rotate(-8deg)}
.m-cross{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:6px}
.m-dir{border:2px solid var(--line);background:var(--paper);border-radius:18px;padding:18px 8px;display:grid;gap:4px;justify-items:center}
.m-dir:hover{border-color:var(--gold);transform:translateY(-3px)} .m-dir{transition:transform .15s}
.m-back{background:repeating-linear-gradient(45deg,color-mix(in srgb,var(--gold) 10%,var(--paper)) 0 10px,var(--paper) 10px 20px)} .m-dir .a{font-size:40px;line-height:1} .m-dir b{font-family:var(--f-display);font-size:24px} .m-dir small{font-size:12px;color:var(--ink-2)}
.m-stampmsg{display:flex;gap:14px;align-items:center;margin-bottom:6px} .m-stampmsg p{margin:0;font-size:15px;line-height:1.6} .m-stampmsg .m-tag{font-family:var(--f-display);font-size:17px;color:var(--ink);margin-bottom:4px}
.m-pill{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:10px;
  background:var(--panel);backdrop-filter:blur(8px);border-radius:999px;padding:6px 6px 6px 14px;box-shadow:var(--shadow);border:2px solid var(--rc);font-size:14.5px;white-space:nowrap;z-index:6;max-width:calc(100vw - 32px)}
.m-pill b{color:var(--rc)} .m-pill .m-walker{font-size:20px}
.m-pill button{border:0;background:var(--rc);color:#fff;border-radius:999px;padding:7px 12px;font-size:13px;font-weight:700}
@media (min-width:861px){.m-pill{left:calc(50% - 180px)}}
.m-walker{display:inline-block;animation:walkbob .5s ease-in-out infinite alternate}

@keyframes walkbob{from{transform:translateY(0) rotate(-4deg)}to{transform:translateY(-6px) rotate(4deg)}}
@media (prefers-reduced-motion: reduce){.m-walker{animation:none}}
.m-tour .food{background:var(--paper)} .m-tour .spot{border-left-color:var(--rc)}
.m-stamp{flex:none;width:84px;height:84px;border-radius:50%;border:4px double var(--rc);color:var(--rc);display:grid;place-items:center;font-family:var(--f-display);font-size:20px;font-weight:700;transform:rotate(-10deg)}
.m-card:not([class*="r-"]){--rc:var(--gold)}
.m-card{border:2px solid var(--rc);border-radius:20px;background:var(--paper);padding:14px 14px 16px;box-shadow:0 6px 0 color-mix(in srgb,var(--rc) 35%,transparent)}
.m-card header{display:flex;justify-content:space-between;align-items:center;font-family:var(--f-mono);font-size:12px;color:var(--rc);border-bottom:1px dashed var(--line);padding-bottom:8px}
.m-card .m-where{font-family:var(--f-display);font-size:18px;font-weight:700}
.m-story{font-size:14px;color:var(--ink-2);margin:10px 0 6px;line-height:1.6}
.m-steps{display:flex;gap:4px;list-style:none;padding:0;margin:0 0 10px;flex-wrap:wrap} .m-steps li{font-size:12px;padding:3px 8px;border-radius:999px;background:var(--mist);color:var(--ink-2)}
.m-steps li.done{background:color-mix(in srgb,var(--ok) 25%,transparent);color:var(--ink)} .m-steps li.cur{background:var(--rc);color:#fff;font-weight:700}
.m-q{text-align:center;padding:6px 4px} .m-q .e{font-size:46px;line-height:1.1} .m-q .ask{font-family:var(--f-display);font-size:22px;font-weight:700;margin:6px 0;text-wrap:balance}
.m-q .clue{font-size:16px;line-height:1.75;margin:6px 0 0;padding:10px 12px;border-radius:12px;background:var(--mist);text-align:left}
.m-log{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:4px 0 8px} .m-logrow{display:flex;justify-content:space-between;border:0;border-left:4px solid var(--rc);background:var(--paper);border-radius:8px;padding:8px 10px;font-size:14px} .m-logrow span{color:var(--rc);letter-spacing:2px}

.toolbar{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:calc(372px + max(16px,env(safe-area-inset-right,0px)));display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.toolbar button{border:0;background:var(--panel);border-radius:12px;padding:8px 12px;font-size:13px;box-shadow:var(--shadow)}
.toolbar button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.timebar{display:flex;align-items:center;gap:2px;background:var(--panel);border-radius:12px;padding:3px;box-shadow:var(--shadow)}
.timebar button{box-shadow:none;padding:6px 8px;display:flex;align-items:center;gap:4px;border-radius:9px;background:transparent}
.timebar svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.timebar output{font-family:var(--f-mono);font-size:12px;padding:0 8px;font-variant-numeric:tabular-nums}
@media (max-width:1300px){.timebar span{display:none}}
.viewpad{position:absolute;right:calc(376px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:grid;gap:6px;z-index:4;
  background:var(--panel);backdrop-filter:blur(8px);border-radius:16px;padding:6px;box-shadow:var(--shadow)}
.vp-seg,.vp-row{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.viewpad button{border:0;background:var(--mist);border-radius:10px;min-width:44px;height:38px;font-size:15px;font-weight:700;color:var(--ink)}
.vp-seg button{font-size:13px}
.viewpad button:hover{background:color-mix(in srgb,var(--gold) 25%,var(--mist))}
.viewpad button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.vp-toggle{display:none}
@media (max-width:860px){
  .vp-toggle{display:block;width:100%;min-width:76px!important;font-size:13px!important}
  .viewpad:not(.open) .vp-seg,.viewpad:not(.open) .vp-row{display:none}
  .viewpad.open .vp-toggle{background:var(--ink);color:var(--paper)}
}
body[data-mode="mission"] .viewpad{bottom:calc(70px + env(safe-area-inset-bottom,0px))}
.tip{position:absolute;left:0;top:0;pointer-events:none;background:var(--ink);color:var(--paper);font-size:12.5px;padding:5px 10px;border-radius:999px;white-space:nowrap;box-shadow:var(--shadow)}

.sidebar{position:absolute;top:0;right:0;bottom:0;width:360px;background:var(--panel);backdrop-filter:blur(8px);
  border-left:1px solid var(--line);display:flex;flex-direction:column;
  padding-top:calc(16px + env(safe-area-inset-top,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
.side-head{padding:0 18px 10px}
.side-head .eyebrow{font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;color:var(--ink-2)}
.side-head h2{font-family:var(--f-display);font-size:24px;margin:4px 0 6px}
.side-head p{margin:0 0 10px;font-size:12.5px;color:var(--ink-2);line-height:1.5}
.search{width:100%;box-sizing:border-box;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:12px;padding:9px 12px;font:inherit;font-size:14px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:10px;background:var(--mist);padding:4px;border-radius:12px}
.tabs button{border:0;background:transparent;border-radius:9px;padding:7px 4px;font-size:13px;font-weight:500}
.tabs button[aria-selected="true"]{background:var(--panel);box-shadow:0 1px 4px rgba(0,0,0,.12);font-weight:700}
.tree{flex:1;overflow:auto;padding:4px 10px calc(18px + env(safe-area-inset-bottom,0px));min-height:0}
.rhead{display:flex;align-items:center;gap:8px;width:100%;border:0;background:transparent;text-align:left;padding:14px 8px 6px;font-family:var(--f-display);font-size:17px;font-weight:700;color:var(--rc)}
.rhead small{font-family:var(--f-body);font-size:11.5px;font-weight:400;color:var(--ink-2)}
.rhead::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--rc)}
.row{display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:transparent;
  padding:9px 8px;border-radius:12px;border-bottom:1px solid var(--line)}
.row:hover,.row.on{background:var(--mist)}
.row .n{font-size:22px;text-align:center}
.row .t{font-size:15px;font-weight:700;min-width:0}
.row .t small{display:block;font-size:11.5px;color:var(--ink-2);font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .c{font-size:11px;color:#fff;background:var(--rc);border-radius:999px;padding:1px 8px;white-space:nowrap}
.hit{display:grid;grid-template-columns:28px 1fr;gap:6px;align-items:start;width:100%;text-align:left;border:0;background:transparent;padding:9px 8px;border-radius:10px;border-bottom:1px solid var(--line);font-size:14px}
.hit:hover{background:var(--mist)} .hit .e{font-size:18px;line-height:1.2;text-align:center} .hit b{font-weight:700}
.hit small{display:block;color:var(--ink-2);font-size:12px;line-height:1.5}
.pip{display:inline-block;font-size:11px;color:#fff;background:var(--rc);border-radius:999px;padding:0 7px;margin-left:4px;vertical-align:1px;font-weight:500}
.note{font-size:11.5px;color:var(--ink-2);line-height:1.6;padding:12px 8px 0}
.bigbtn{width:100%;border:0;background:var(--ink);color:var(--paper);border-radius:14px;padding:14px;font-weight:700;font-size:16px;margin:10px 0 4px}
.bigbtn.alt{background:var(--mist);color:var(--ink)}
.quiz-intro{padding:8px;font-size:13.5px;line-height:1.7;color:var(--ink-2)}
.quiz-intro b{color:var(--ink)}

.card{position:absolute;left:max(16px,env(safe-area-inset-left,0px));top:calc(170px + env(safe-area-inset-top,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));
  width:min(400px,calc(100vw - 32px));background:var(--panel);backdrop-filter:blur(8px);border-radius:20px;box-shadow:var(--shadow);
  display:flex;flex-direction:column;overflow:hidden;border-top:6px solid var(--rc)}
.card .close{position:absolute;right:10px;top:8px;border:0;background:transparent;font-size:24px;line-height:1;padding:4px 8px;color:var(--ink-2)}
#card-content{overflow:auto;padding:16px 18px 22px;min-height:0}
.card .eyebrow{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;color:var(--rc)}
.card h3{font-family:var(--f-display);font-size:32px;margin:2px 0 4px;padding-right:28px}
.card h3 small{font-family:var(--f-body);font-size:13px;color:var(--ink-2);font-weight:400;margin-left:6px}
.card .lede{font-size:14px;color:var(--ink-2);margin:0 0 6px;line-height:1.6}
.card h4{font-family:var(--f-display);font-size:18px;margin:16px 0 6px;display:flex;align-items:center;gap:6px}
.food{display:grid;grid-template-columns:40px 1fr;gap:8px;align-items:start;padding:9px 10px;border-radius:12px;background:var(--paper);border:1px solid var(--line);margin-top:6px}
.food .e{font-size:26px;line-height:1.1;text-align:center}
.food b{font-size:15px} .food p{margin:2px 0 0;font-size:13px;line-height:1.55;color:var(--ink-2)}
.spot{padding:8px 10px 8px 12px;border-left:3px solid var(--rc);margin-top:6px;background:var(--paper);border-radius:0 10px 10px 0}
.spot b{font-size:14.5px} .spot p{margin:1px 0 0;font-size:13px;line-height:1.55;color:var(--ink-2)}
.card h4 small{font-family:var(--f-body);font-size:11.5px;font-weight:400;color:var(--ink-2)}
.item-d{margin-top:6px;border:1px solid var(--line);border-radius:12px;background:var(--paper);overflow:hidden}
.item-d.is-spot{border-left:4px solid var(--rc)}
.item-d summary{display:grid;grid-template-columns:34px 1fr 18px;gap:8px;align-items:center;padding:9px 10px;cursor:pointer;list-style:none}
.item-d summary::-webkit-details-marker{display:none}
.item-d summary:hover{background:var(--mist)}
.item-d .e{font-size:24px;text-align:center;line-height:1} .item-d .tx{min-width:0} .item-d b{font-size:15px;display:block}
.item-d small{display:block;font-size:12.5px;color:var(--ink-2);line-height:1.5}
.item-d .chev{font-size:20px;color:var(--ink-2);transition:transform .2s} .item-d[open] .chev{transform:rotate(90deg)}
.item-d[open]{border-color:var(--rc);box-shadow:0 2px 10px rgba(0,0,0,.08)}
.item-d .badge{display:inline-block;font-style:normal;font-size:11px;font-weight:700;line-height:1;padding:3px 6px;margin-left:6px;border-radius:999px;background:var(--gold);color:#3a2a00;vertical-align:2px}
.more-list{margin-top:6px}
.more-list>summary{list-style:none;cursor:pointer;text-align:center;font-weight:700;font-size:14px;padding:9px;border:1px dashed var(--line);border-radius:12px;color:var(--ink-2)}
.more-list>summary::-webkit-details-marker{display:none}
.more-list>summary:hover{background:var(--mist);color:var(--ink)}
.more-list .ml-open,.more-list[open] .ml-closed{display:none} .more-list[open] .ml-open{display:inline}
.more-list[open]>summary{margin-bottom:2px}
.item-body{padding:2px 12px 12px 12px;border-top:1px dashed var(--line)}
.feats{margin:8px 0 10px;padding-left:20px;font-size:14px;line-height:1.7} .feats li::marker{color:var(--rc)}
.links{display:flex;flex-wrap:wrap;gap:6px}
.links a.map{background:var(--rc);border-color:var(--rc);color:#fff}
.shops{margin:4px 0 10px;border-radius:12px;background:color-mix(in srgb,var(--gold) 10%,transparent);padding:8px}

/* ---------- map Taiwan onto the hex lattice ---------- */
const LAND_H = .42, LAT0 = 23.75, LON0 = 120.95, KM = .11, CL = Math.cos(23.7*Math.PI/180);
const proj = (lon, lat) => [(lon-LON0)*CL*111*KM, -(lat-LAT0)*111*KM];

  if(dq > dr && dq > ds) rq = -rr-rs; else if(dr > ds) rr = -rq-rs; return [rq, rr]; }
const toAxial = (x, z) => { const r = z/(1.5*HEX); return [x/(HEX*Math.sqrt(3)) - r/2, r]; };
const OUTLINE = [[121.54,25.30],[121.92,25.13],[122.0,25.0],[121.86,24.6],[121.62,24.0],[121.4,23.3],[121.18,22.75],[120.90,22.35],[120.85,21.90],[120.72,21.93],[120.6,22.3],[120.27,22.6],[120.1,23.0],[120.13,23.45],[120.2,23.8],[120.4,24.15],[120.6,24.45],[120.75,24.65],[120.9,24.85],[121.05,25.07],[121.4,25.2]].map(p => proj(...p));

function layout(){
  const taken = new Map(), main = [];
  CS.forEach((c, i) => { const [x, z] = OFFSHORE[c.id] || proj(...c.ll); const [fq, fr] = toAxial(x, z); let best = null;
    for(let dq=-3; dq<=3; dq++) for(let dr=-3; dr<=3; dr++){ const q = Math.round(fq)+dq, r = Math.round(fr)+dr, k = q+','+r; if(taken.has(k)) continue;
      const [cx, cz] = axial(q, r), d = (cx-x)**2 + (cz-z)**2; if(!best || d < best[0]) best = [d, q, r]; }
    taken.set(best[1]+','+best[2], i); c.q = best[1]; c.r = best[2]; if(!OFFSHORE[c.id]) main.push(c); });
  const fill = [];
  for(let q=-16; q<=16; q++) for(let r=-12; r<=12; r++){ const k = q+','+r; if(taken.has(k)) continue; const [x, z] = axial(q, r); if(inPoly(x, z, OUTLINE)) fill.push({q, r}); }
  const land = new Set([...main.map(c => c.q+','+c.r), ...fill.map(f => f.q+','+f.r)]);
  const mx = main.reduce((s,c) => s + axial(c.q,c.r)[0], 0)/main.length;
  const near = (lon, lat) => { const [x,z] = proj(lon, lat); return fill.reduce((b,f) => { const [fx,fz] = axial(f.q,f.r), d = (fx-x)**2+(fz-z)**2; return d < b[0] ? [d,f] : b; }, [1e9,null])[1]; };
  fill.forEach(f => { const [x] = axial(f.q, f.r); f.kind = (!land.has((f.q-1)+','+f.r) && x < mx) ? 'plain' : 'mount'; });
  const yu = near(120.957, 23.47), xue = near(121.23, 24.38); if(yu){ yu.kind = 'mount'; yu.peak = '玉山　3,952 公尺'; } if(xue && xue !== yu){ xue.kind = 'mount'; xue.peak = '雪山　3,886 公尺'; }
  return {fill, land};
}

function bfs(a, b){ const {adj} = NAV, prev = new Map([[a, -1]]), q = [a];

  const cntyOpts = shuffle([ci, ...pickN(CS.map((_,i) => i).filter(i => i !== ci), 3)]);
  const spotOpts = shuffle([q.spot, ...pickN(others.map(o => o.quest.spot), 3)]);
  const q4 = q.q4, q4o = shuffle(q4[1].map((t,k) => ({t, ok:k === q4[2]})));
  const food = c.foods.find(f => f.n === q.food);
  return [
    {tag:'猜特產', e:'🍱', ask:'猜猜看，說的是哪一樣特產？', clue:q.fr, opts:foodOpts, ok:q.food, why:`答案是「${q.food}」。${food?.d ?? ''}`},
    {tag:'猜縣市', e:food?.e ?? '📍', ask:`「${q.food}」是哪個縣市的名產？`, opts:cntyOpts.map(i => CS[i].name), ok:c.name, why:`${q.food}是${c.full}的名產。完成這張任務卡，就出發去${c.name}！`, arrive:true},
    {tag:'猜景點', e:'📍', ask:`來到${c.name}，猜猜這是哪一個景點？`, clue:q.sr, opts:spotOpts, ok:q.spot, why:`答案是「${q.spot}」。${c.spots.find(s => s.n === q.spot)?.d ?? ''}`},
    {tag:'景點問答', e:'❓', ask:q4[0], opts:q4o.map(o => o.t), ok:q4o.find(o => o.ok).t, why:q4[3]},
  ];
}

/* ---------- screens ---------- */
function openMission(){ setMode('mission'); MS = {step:'pick', role:MS?.role ?? ROLES[0], look:MS?.look ?? 'minnan'}; $('#card').hidden = true; $('#board').hidden = false; $('#board').classList.add('mission'); renderMission(); }
function startMission(){ clearStamps(); removeAvatar(); const at = ci$(MS.role.start);
  Object.assign(MS, {step:'cross', at, home:at, visited:[], n:0, score:0, log:[], opts:null}); placeAvatar(at); highlight(t => t === tiles[at]); flyTo(new THREE.Vector3(tiles[at].world.x, 1, tiles[at].world.z + .2), isPhone() ? 22 : 18, VIEW.county); renderMission(); }
function goDirection(o){ MS.step = 'card'; MS.dest = o.i; MS.dir = o.label; MS.opts = null; MS.qs = buildCard(o.i); MS.qi = 0; MS.ans = null; MS.cardScore = 0; MS.n++; renderMission(); }
function answer(k){ const Q = MS.qs[MS.qi]; if(MS.ans != null) return; MS.ans = k; const ok = Q.opts[k] === Q.ok; if(ok){ MS.score++; MS.cardScore++; }
  if(Q.arrive){ const t = tiles[MS.dest]; highlight(x => x === t); }
  renderMission(); }
function nextQ(){ if(MS.qi < 3){ MS.qi++; MS.ans = null; renderMission(); return; }
  MS.visited.push(MS.dest); MS.log.push({ci:MS.dest, s:MS.cardScore}); MS.step = 'walking'; renderMission();
  if(nightAmt > .3) todJump = {from:tod, d:((10 - tod) % 24 + 24) % 24, t:0};
  placeAvatar(MS.dest, true, arrive); }
function arrive(){ if(!MS || MS.step !== 'walking') return; MS.at = MS.dest; stamp(MS.dest); MS.step = 'tour'; renderMission(); }
function skipWalk(){ if(walk){ walk.d = walk.L.at(-1) - .001; } else arrive(); }

function renderMission(){
  const body = $('#board-body'), title = $('#board-title'), eye = $('#board-eyebrow'); $('#board').hidden = MS.step === 'walking'; pill.hidden = MS.step !== 'walking';
  const prog = () => `<div class="m-pass" aria-label="已蓋 ${MS.visited.length} 個章">${Array.from({length:CARDS_PER_GAME}, (_,k) => { const v = MS.log[k]; return `<i class="${v ? 'on r-'+CS[v.ci].region : ''}" title="${v ? esc(CS[v.ci].name) : ''}">${v ? esc(CS[v.ci].name.slice(0,2)) : k+1}</i>`; }).join('')}</div>`;
  if(MS.step === 'pick'){ eye.textContent = 'MISSION · 任務模式'; title.textContent = '選一個角色出發';
    body.innerHTML = `<p class="m-lead">每個角色從不同的縣市出發。走到十字路口時從三張蓋著的卡裡抽一張；每張卡 4 題，走完 ${CARDS_PER_GAME} 張卡共 ${CARDS_PER_GAME*4} 題。</p>
      <div class="m-roles">${ROLES.map(r => `<button class="m-role ${r === MS.role ? 'on' : ''}" data-role="${r.id}"><span class="e">${r.e}</span><b>${r.n}</b><small>${esc(r.goal)}</small><em>從${esc(CS[ci$(r.start)].name)}出發</em></button>`).join('')}</div>
      <h4 class="m-h">外型</h4><div class="m-looks">${LOOKS.map(([k,n]) => `<button data-look="${k}" aria-pressed="${MS.look === k}">${n}</button>`).join('')}</div>
      <button class="bigbtn" data-go="start">${MS.role.e} 以「${MS.role.n}」出發</button>`; return; }
  if(MS.step === 'walking'){ const c = CS[MS.dest], last = MS.log.at(-1);
    pill.className = 'm-pill r-' + c.region; pill.innerHTML = `<span class="m-walker">🚶</span><span>答對 <b>${last.s}</b>/4・前往 <b>${esc(c.name)}</b>${tiles[MS.dest].off || tiles[MS.at].off ? '（坐船）' : ''}</span><button data-go="skip">直接抵達 ›</button>`; return; }
  if(MS.step === 'tour'){ const c = CS[MS.at], last = MS.log.at(-1);
    eye.textContent = `${MS.role.e} ${MS.role.n} · 第 ${MS.n} 站`; title.textContent = `抵達${c.name}！`;
    body.innerHTML = prog() + `<div class="m-tour r-${c.region}">
      <div class="m-stampmsg"><span class="m-stamp">${esc(c.name)}</span><div><p class="m-tag">${esc(c.tagline)}</p><p>這站答對 <b>${last.s}</b> / 4 題・累計 <b>${MS.score}</b> 分</p></div></div>
      <h4 class="m-h">🍱 ${esc(c.name)}的名產</h4>${listHTML(c, c.foods, 'food', null, '名產')}
      <h4 class="m-h">📍 ${esc(c.name)}的景點</h4>${listHTML(c, c.spots, 'spot', null, '景點')}
      <h4 class="m-h">💬 一起聊聊</h4><ul class="talk">${c.talk.map(x => `<li>${esc(x)}</li>`).join('')}</ul>
      <button class="bigbtn" data-go="${MS.n >= CARDS_PER_GAME ? 'finish' : 'onward'}">${MS.n >= CARDS_PER_GAME ? '看環島成績 ›' : '繼續旅程，前往十字路口 ›'}</button></div>`;
    body.scrollTop = 0; return; }
  if(MS.step === 'cross'){ const here = CS[MS.at];
    eye.textContent = `${MS.role.e} ${MS.role.n} · 第 ${MS.n + 1} / ${CARDS_PER_GAME} 張任務卡`; title.textContent = '十字路口';
    const opts = crossroads(); MS.optsFor = MS.n;
    body.innerHTML = prog() + `<p class="m-lead">${esc(MS.role.goal)}現在在 <b>${esc(here.name)}</b>。三張任務卡都蓋著，抽一張吧！要去哪裡，答完第 2 題才揭曉。</p>` +
      `<div class="m-cross" role="group" aria-label="抽一張任務卡">${opts.map((o,k) => `<button class="m-dir m-back" data-dir="${k}"><span class="a">${o.mark}</span><b>${o.label}</b><small>翻開這張</small></button>`).join('')}</div>`;
    MS.opts = opts; return; }
  if(MS.step === 'card'){ const Q = MS.qs[MS.qi], done = MS.ans != null, c = CS[MS.dest], shown = MS.qi >= 1 && (MS.qi > 1 || done);
    eye.textContent = `${MS.role.e} ${MS.role.n} · 任務卡 ${MS.n} / ${CARDS_PER_GAME}`; title.textContent = shown ? `${c.name}任務卡` : '神秘任務卡';
    body.innerHTML = prog() + `<article class="m-card ${shown ? 'r-'+c.region : ''}">
      <header><span class="m-no">No.${String(MS.n).padStart(2,'0')}</span><span class="m-where">${shown ? esc(c.full) : '？？？'}</span></header>
      <p class="m-story">${esc(MS.role.line(c))}</p>
      <ol class="m-steps">${MS.qs.map((x,k) => `<li class="${k < MS.qi ? 'done' : k === MS.qi ? 'cur' : ''}">${k+1}. ${x.tag}</li>`).join('')}</ol>
      <div class="m-q"><div class="e">${Q.e}</div><p class="ask">${esc(Q.ask)}</p>${Q.clue ? `<p class="clue">${esc(Q.clue)}</p>` : ''}</div>
      <div class="opts">${Q.opts.map((o,k) => `<button data-ans="${k}" ${done ? 'disabled' : ''} class="${done && o === Q.ok ? 'ok' : done && k === MS.ans ? 'no' : ''}">${esc(o)}</button>`).join('')}</div>
      ${done ? `<div class="q-explain">${Q.opts[MS.ans] === Q.ok ? '⭕ 答對了！' : '❌ 差一點～'} ${esc(Q.why)}</div><button class="bigbtn" data-go="next">${MS.qi < 3 ? '下一題 ›' : '完成任務，蓋章！'}</button>` : ''}
    </article>`; return; }
  if(MS.step === 'end'){ eye.textContent = `${MS.role.e} ${MS.role.n} · 任務完成`; title.textContent = '環島任務完成！';
    body.innerHTML = prog() + `<div class="q-score"><div class="big">${MS.score} / ${CARDS_PER_GAME*4}</div><p>${MS.score >= 32 ? '台灣通！每個地方都難不倒你。' : MS.score >= 20 ? '很厲害！再走一次會更熟。' : '辛苦了！換個角色、換條路線再玩一次吧。'}</p></div>
      <div class="m-log">${MS.log.map(l => `<button class="m-logrow r-${CS[l.ci].region}" data-ci="${l.ci}"><b>${esc(CS[l.ci].name)}</b><span>${'●'.repeat(l.s)}${'○'.repeat(4-l.s)}</span></button>`).join('')}</div>
      <button class="bigbtn" data-go="again">換個角色再玩</button><button class="bigbtn alt" data-go="explore">回到「到處去看看」</button>`; }
}
$('#board-body').addEventListener('click', e => { if(!MS || !$('#board').classList.contains('mission')) return; const b = e.target.closest('button'); if(!b) return;
  if(b.dataset.role){ MS.role = ROLES.find(r => r.id === b.dataset.role); renderMission(); }
  else if(b.dataset.look){ MS.look = b.dataset.look; renderMission(); }
  else if(b.dataset.dir != null) goDirection(MS.opts[+b.dataset.dir]);
  else if(b.dataset.ans != null) answer(+b.dataset.ans);
  else if(b.dataset.ci != null) selectCounty(+b.dataset.ci);
  else if(b.dataset.go === 'start') startMission();
  else if(b.dataset.go === 'next') nextQ();
  else if(b.dataset.go === 'skip') skipWalk();
  else if(b.dataset.go === 'onward'){ MS.step = 'cross'; renderMission(); }
  else if(b.dataset.go === 'finish'){ MS.step = 'end'; renderMission(); overview(); }
  else if(b.dataset.go === 'again') openMission();
  else if(b.dataset.go === 'explore') setMode('explore'); });

/* ---------- the two modes ---------- */
function setMode(m){ document.querySelectorAll('[data-mode]').forEach(b => b.setAttribute('aria-pressed', b.dataset.mode === m)); document.body.dataset.mode = m;
  if(m === 'explore'){ pill.hidden = true; $('#board').hidden = true; $('#board').classList.remove('mission'); removeAvatar(); clearStamps(); MS = MS && {role:MS.role, look:MS.look}; highlight(null); overview(); }
  else if(isPhone()) $('#sidebar').classList.add('min'); }
document.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => b.dataset.mode === 'mission' ? openMission() : setMode('explore'));
const _closeBoard = $('#board-close').onclick; $('#board-close').onclick = () => { if($('#board').classList.contains('mission')) setMode('explore'); else _closeBoard(); };

</script>
